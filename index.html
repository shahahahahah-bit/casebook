<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Casebook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d3560;
    --bg-deep: #0a2a4d;
    --panel: rgba(9, 36, 66, 0.82);
    --ink: #e4f0ff;
    --ink-soft: #a9c4e4;
    --ink-faint: #6f93bd;
    --line: rgba(196, 222, 255, 0.28);
    --line-strong: rgba(214, 233, 255, 0.7);
    --grid-minor: rgba(160, 200, 245, 0.07);
    --grid-major: rgba(160, 200, 245, 0.14);
    --accent: #ffd36a;
    --danger: #ff9b8a;
    --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
    --sans: "IBM Plex Sans", system-ui, -apple-system, sans-serif;
    --display: "Barlow Condensed", "Arial Narrow", sans-serif;
  }
  :root[data-theme="vellum"] {
    --bg: #f2efe6;
    --bg-deep: #e8e3d6;
    --panel: rgba(247, 244, 236, 0.92);
    --ink: #17365f;
    --ink-soft: #3d5c86;
    --ink-faint: #7d90ab;
    --line: rgba(23, 54, 95, 0.22);
    --line-strong: rgba(23, 54, 95, 0.65);
    --grid-minor: rgba(23, 54, 95, 0.045);
    --grid-major: rgba(23, 54, 95, 0.09);
    --accent: #c8452c;
    --danger: #b3321c;
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background-color: var(--bg);
    background-image:
      linear-gradient(var(--grid-major) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid-major) 1px, transparent 1px),
      linear-gradient(var(--grid-minor) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid-minor) 1px, transparent 1px);
    background-size: 100px 100px, 100px 100px, 20px 20px, 20px 20px;
    background-attachment: fixed;
    color: var(--ink);
    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.55;
    min-height: 100vh;
    transition: background-color .3s, color .3s;
  }
  ::selection { background: var(--accent); color: var(--bg-deep); }
  a { color: inherit; }
  button, input, select, textarea { font: inherit; color: inherit; }

  .sheet {
    max-width: 1240px;
    margin: 0 auto;
    padding: 28px 24px 80px;
  }
  .frame {
    border: 1px solid var(--line-strong);
    outline: 1px solid var(--line);
    outline-offset: 6px;
    position: relative;
  }

  /* ---------- Title block ---------- */
  .masthead {
    display: grid;
    grid-template-columns: 1fr minmax(280px, 380px);
    border-bottom: 1px solid var(--line-strong);
  }
  .masthead-title {
    padding: 34px 32px 30px;
    border-right: 1px solid var(--line-strong);
    position: relative;
  }
  .eyebrow {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }
  h1 {
    font-family: var(--display);
    font-weight: 500;
    font-size: clamp(54px, 9vw, 112px);
    line-height: .86;
    letter-spacing: .01em;
    text-transform: uppercase;
    margin: 14px 0 16px;
  }
  h1 span { color: var(--accent); }
  .lede {
    max-width: 46ch;
    color: var(--ink-soft);
    margin: 0;
  }
  .north {
    position: absolute;
    right: 28px;
    top: 28px;
    width: 54px;
    height: 54px;
    color: var(--ink-soft);
  }
  .titleblock {
    display: grid;
    grid-template-columns: 1fr 1fr;
    font-family: var(--mono);
    font-size: 12px;
  }
  .tb-cell {
    padding: 10px 14px;
    border-bottom: 1px solid var(--line);
    border-right: 1px solid var(--line);
    min-width: 0;
  }
  .tb-cell:nth-child(2n) { border-right: 0; }
  .tb-cell.wide { grid-column: 1 / -1; border-right: 0; }
  .tb-cell:last-child, .tb-cell.last { border-bottom: 0; }
  .tb-label {
    display: block;
    font-size: 9.5px;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--ink-faint);
    margin-bottom: 2px;
  }
  .tb-value { font-size: 13px; overflow-wrap: anywhere; }
  .tb-value.big {
    font-family: var(--display);
    font-size: 30px;
    line-height: 1;
    letter-spacing: .02em;
  }

  /* ---------- Toolbar ---------- */
  .toolbar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px 14px;
    padding: 16px 20px;
    border-bottom: 1px solid var(--line-strong);
    background: color-mix(in srgb, var(--bg-deep) 55%, transparent);
  }
  .search {
    flex: 1 1 220px;
    display: flex;
    align-items: center;
    gap: 8px;
    border: 1px solid var(--line);
    padding: 0 10px;
    height: 36px;
    background: color-mix(in srgb, var(--bg) 70%, transparent);
  }
  .search:focus-within { border-color: var(--line-strong); }
  .search svg { flex: none; color: var(--ink-faint); }
  .search input {
    border: 0;
    background: none;
    outline: none;
    width: 100%;
    font-family: var(--mono);
    font-size: 13px;
  }
  .search input::placeholder { color: var(--ink-faint); }
  kbd {
    font-family: var(--mono);
    font-size: 10px;
    border: 1px solid var(--line);
    padding: 1px 5px;
    color: var(--ink-faint);
  }
  .btn {
    height: 36px;
    padding: 0 14px;
    border: 1px solid var(--line-strong);
    background: transparent;
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: .08em;
    text-transform: uppercase;
    cursor: pointer;
    white-space: nowrap;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    transition: background .15s, color .15s, border-color .15s;
  }
  .btn:hover { background: var(--ink); color: var(--bg-deep); }
  .btn.primary { background: var(--accent); color: var(--bg-deep); border-color: var(--accent); }
  .btn.primary:hover { filter: brightness(1.08); }
  .btn.ghost { border-color: var(--line); color: var(--ink-soft); }
  .btn.ghost:hover { color: var(--bg-deep); }
  .btn.danger { border-color: var(--danger); color: var(--danger); }
  .btn.danger:hover { background: var(--danger); color: var(--bg-deep); }
  .btn.small { height: 28px; padding: 0 10px; font-size: 11px; }
  select.btn { appearance: none; padding-right: 28px; background-image: linear-gradient(45deg, transparent 50%, currentColor 50%), linear-gradient(135deg, currentColor 50%, transparent 50%); background-position: calc(100% - 15px) 15px, calc(100% - 10px) 15px; background-size: 5px 5px; background-repeat: no-repeat; }
  select.btn:hover { background-color: var(--ink); }
  select.btn option { color: #111; background: #fff; }
  .toolbar-group { display: flex; gap: 8px; flex-wrap: wrap; }

  .filters {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    padding: 14px 20px;
    border-bottom: 1px solid var(--line-strong);
    align-items: center;
  }
  .filters .eyebrow { margin-right: 6px; }
  .chip {
    font-family: var(--mono);
    font-size: 11.5px;
    letter-spacing: .06em;
    text-transform: uppercase;
    padding: 4px 10px;
    border: 1px dashed var(--line);
    background: none;
    cursor: pointer;
    color: var(--ink-soft);
    display: inline-flex;
    gap: 6px;
    align-items: center;
  }
  .chip:hover { border-style: solid; color: var(--ink); }
  .chip[aria-pressed="true"] {
    border-style: solid;
    border-color: var(--ink);
    background: var(--ink);
    color: var(--bg-deep);
  }
  .chip .count { opacity: .6; }

  /* ---------- Cards ---------- */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
    gap: 0;
  }
  .card {
    position: relative;
    text-align: left;
    background: none;
    border: 0;
    border-right: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
    padding: 18px 20px 18px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    gap: 10px;
    min-height: 330px;
    transition: background .2s;
  }
  .card:hover, .card:focus-visible {
    background: color-mix(in srgb, var(--ink) 6%, transparent);
    outline: none;
  }
  .card::before, .card::after {
    content: "";
    position: absolute;
    width: 14px; height: 14px;
    border-color: var(--accent);
    border-style: solid;
    opacity: 0;
    transition: opacity .2s, transform .2s;
  }
  .card::before { top: 8px; left: 8px; border-width: 1px 0 0 1px; transform: translate(4px, 4px); }
  .card::after { bottom: 8px; right: 8px; border-width: 0 1px 1px 0; transform: translate(-4px, -4px); }
  .card:hover::before, .card:hover::after,
  .card:focus-visible::before, .card:focus-visible::after { opacity: 1; transform: none; }
  .card-top {
    display: flex;
    justify-content: space-between;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--ink-faint);
    letter-spacing: .06em;
  }
  .card-code { color: var(--ink-soft); }
  .glyph {
    height: 108px;
    border: 1px solid var(--line);
    display: grid;
    place-items: center;
    color: var(--ink-soft);
    position: relative;
    background:
      linear-gradient(var(--grid-minor) 1px, transparent 1px) 0 0 / 12px 12px,
      linear-gradient(90deg, var(--grid-minor) 1px, transparent 1px) 0 0 / 12px 12px;
    transition: color .2s;
  }
  .card:hover .glyph { color: var(--ink); }
  .glyph svg { width: 70%; height: 82%; overflow: visible; }
  .glyph-label {
    position: absolute;
    left: 6px; bottom: 4px;
    font-family: var(--mono);
    font-size: 9px;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--ink-faint);
  }
  .card h3 {
    font-family: var(--display);
    font-weight: 500;
    font-size: 30px;
    line-height: 1;
    letter-spacing: .01em;
    text-transform: uppercase;
    margin: 4px 0 0;
  }
  .card-place {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--ink-soft);
  }
  .card-brief {
    color: var(--ink-soft);
    font-size: 14px;
    margin: 0;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .card-foot {
    margin-top: auto;
    display: flex;
    gap: 12px;
    font-family: var(--mono);
    font-size: 10.5px;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--ink-faint);
    border-top: 1px dashed var(--line);
    padding-top: 10px;
  }
  .empty {
    grid-column: 1 / -1;
    padding: 70px 20px;
    text-align: center;
    font-family: var(--mono);
    color: var(--ink-soft);
  }

  .legend {
    display: flex;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px 20px;
    padding: 12px 20px;
    font-family: var(--mono);
    font-size: 10.5px;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--ink-faint);
  }
  .scalebar { display: inline-flex; align-items: center; gap: 8px; }
  .scalebar i {
    display: inline-block; width: 100px; height: 6px;
    border: 1px solid var(--ink-faint);
    background: linear-gradient(90deg, var(--ink-faint) 25%, transparent 25% 50%, var(--ink-faint) 50% 75%, transparent 75%);
  }

  /* ---------- Dialog ---------- */
  dialog {
    width: min(920px, calc(100vw - 32px));
    max-height: calc(100vh - 48px);
    padding: 0;
    border: 1px solid var(--line-strong);
    background: var(--bg);
    color: var(--ink);
    box-shadow: 0 30px 80px rgba(0, 0, 0, .45);
  }
  dialog::backdrop { background: rgba(4, 18, 36, .6); backdrop-filter: blur(3px); }
  :root[data-theme="vellum"] dialog::backdrop { background: rgba(40, 46, 60, .35); }
  dialog[open] { animation: rise .22s ease-out; }
  @keyframes rise { from { opacity: 0; transform: translateY(12px); } }
  .dlg-head {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 16px;
    padding: 22px 26px 18px;
    border-bottom: 1px solid var(--line-strong);
    background-image:
      linear-gradient(var(--grid-minor) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid-minor) 1px, transparent 1px);
    background-size: 20px 20px;
  }
  .dlg-head h2 {
    font-family: var(--display);
    font-weight: 500;
    font-size: clamp(36px, 6vw, 56px);
    line-height: .92;
    text-transform: uppercase;
    margin: 6px 0 6px;
  }
  .dlg-actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
  .close-x { width: 36px; padding: 0; justify-content: center; font-size: 18px; }
  .dlg-body {
    display: grid;
    grid-template-columns: 300px 1fr;
  }
  .dlg-col { padding: 22px 26px; min-width: 0; }
  .dlg-col + .dlg-col { border-left: 1px solid var(--line); }
  .section-title {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--ink-faint);
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    border-bottom: 1px solid var(--line);
    padding-bottom: 6px;
    margin: 0 0 12px;
  }
  .facts { margin: 0 0 24px; }
  .facts div {
    display: grid;
    grid-template-columns: 92px 1fr;
    gap: 10px;
    padding: 7px 0;
    border-bottom: 1px dashed var(--line);
  }
  .facts dt {
    font-family: var(--mono);
    font-size: 10.5px;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--ink-faint);
    padding-top: 2px;
  }
  .facts dd { margin: 0; font-size: 14px; overflow-wrap: anywhere; }
  .facts .tags { display: flex; flex-wrap: wrap; gap: 4px; }
  .tag {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: .08em;
    text-transform: uppercase;
    border: 1px solid var(--line);
    padding: 1px 6px;
    color: var(--ink-soft);
  }
  .dlg-glyph { height: 150px; margin-bottom: 20px; }
  .links { list-style: none; padding: 0; margin: 0 0 12px; }
  .links li {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 0;
    border-bottom: 1px dashed var(--line);
  }
  .links .idx { font-family: var(--mono); font-size: 11px; color: var(--ink-faint); flex: none; }
  .links a {
    flex: 1;
    min-width: 0;
    text-decoration: none;
    overflow-wrap: anywhere;
  }
  .links a:hover .link-label { text-decoration: underline; text-underline-offset: 3px; }
  .link-host { display: block; font-family: var(--mono); font-size: 11px; color: var(--ink-faint); }
  .icon-btn {
    border: 0; background: none; cursor: pointer;
    color: var(--ink-faint); font-family: var(--mono); font-size: 14px;
    padding: 4px 6px;
  }
  .icon-btn:hover { color: var(--danger); }
  .add-link { display: grid; grid-template-columns: 1fr 1.4fr auto; gap: 8px; }
  .field {
    height: 34px;
    border: 1px solid var(--line);
    background: color-mix(in srgb, var(--bg-deep) 60%, transparent);
    padding: 0 10px;
    font-size: 13px;
    outline: none;
    min-width: 0;
  }
  .field:focus { border-color: var(--line-strong); }
  .field::placeholder { color: var(--ink-faint); }
  textarea.field { height: auto; padding: 8px 10px; resize: vertical; }

  /* Edit form */
  .form { padding: 22px 26px 26px; display: grid; grid-template-columns: 1fr 1fr; gap: 14px 18px; }
  .form label { display: grid; gap: 5px; }
  .form label > span, .form fieldset legend {
    font-family: var(--mono);
    font-size: 10.5px;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--ink-faint);
  }
  .form .full { grid-column: 1 / -1; }
  .form fieldset { border: 0; padding: 0; margin: 0; }
  .theme-picks { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
  .theme-picks input { position: absolute; opacity: 0; pointer-events: none; }
  .theme-picks input:checked + .chip { border-style: solid; border-color: var(--ink); background: var(--ink); color: var(--bg-deep); }
  .theme-picks input:focus-visible + .chip { outline: 2px solid var(--accent); outline-offset: 2px; }
  .form-foot { grid-column: 1 / -1; display: flex; justify-content: flex-end; gap: 8px; margin-top: 6px; }
  .req { color: var(--accent); }

  .toast {
    position: fixed; left: 50%; bottom: 24px;
    transform: translate(-50%, 20px);
    background: var(--ink); color: var(--bg-deep);
    font-family: var(--mono); font-size: 12px; letter-spacing: .06em;
    padding: 10px 16px; opacity: 0; pointer-events: none;
    transition: opacity .2s, transform .2s; z-index: 10;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  @media (max-width: 820px) {
    .masthead { grid-template-columns: 1fr; }
    .masthead-title { border-right: 0; border-bottom: 1px solid var(--line-strong); }
    .dlg-body { grid-template-columns: 1fr; }
    .dlg-col + .dlg-col { border-left: 0; border-top: 1px solid var(--line); }
  }
  @media (max-width: 560px) {
    .sheet { padding: 16px 16px 60px; }
    .frame { outline-offset: 3px; }
    .masthead-title { padding: 26px 18px 22px; }
    .north { width: 40px; height: 40px; right: 16px; top: 18px; }
    .toolbar, .filters { padding-left: 14px; padding-right: 14px; }
    .card { border-right: 0; min-height: 0; }
    .form { grid-template-columns: 1fr; padding: 18px; }
    .dlg-head, .dlg-col { padding-left: 18px; padding-right: 18px; }
    .add-link { grid-template-columns: 1fr; }
    dialog { width: calc(100vw - 16px); max-height: calc(100vh - 16px); }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; animation: none !important; }
  }
</style>
</head>
<body>
<div class="sheet">
  <div class="frame">
    <header class="masthead">
      <div class="masthead-title">
        <svg class="north" viewBox="0 0 60 60" fill="none" stroke="currentColor" stroke-width="1" aria-hidden="true">
          <circle cx="30" cy="30" r="22"/>
          <circle cx="30" cy="30" r="2"/>
          <path d="M30 6 L36 32 L30 28 L24 32 Z" fill="currentColor" fill-opacity=".25"/>
          <path d="M30 54 V48 M6 30 h6 M54 30 h-6"/>
          <text x="30" y="4" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="7" fill="currentColor" stroke="none">N</text>
        </svg>
        <div class="eyebrow">A personal archive · urbanism &amp; architecture</div>
        <h1>Case<span>/</span>book</h1>
        <p class="lede">Places, plans and buildings worth coming back to. Open a sheet to read the facts and follow the sources.</p>
      </div>
      <div class="titleblock" aria-label="Title block">
        <div class="tb-cell"><span class="tb-label">Entries</span><span class="tb-value big" id="tb-count">00</span></div>
        <div class="tb-cell"><span class="tb-label">Sources</span><span class="tb-value big" id="tb-sources">00</span></div>
        <div class="tb-cell"><span class="tb-label">Scale</span><span class="tb-value">N.T.S.</span></div>
        <div class="tb-cell"><span class="tb-label">Sheet</span><span class="tb-value">01 of 01</span></div>
        <div class="tb-cell wide"><span class="tb-label">Last revision</span><span class="tb-value" id="tb-rev">—</span></div>
        <div class="tb-cell wide last">
          <span class="tb-label">Drawing set</span>
          <span class="toolbar-group" style="margin-top:4px">
            <button class="btn small ghost" id="theme-toggle" type="button">Vellum</button>
            <button class="btn small ghost" id="export-btn" type="button">Export</button>
            <button class="btn small ghost" id="import-btn" type="button">Import</button>
            <input type="file" id="import-file" accept="application/json,.json" hidden>
          </span>
        </div>
      </div>
    </header>

    <div class="toolbar">
      <label class="search">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><circle cx="7" cy="7" r="5"/><path d="M11 11l4 4"/></svg>
        <span class="sr-only">Search</span>
        <input id="search" type="search" placeholder="Search places, people, sources…" autocomplete="off">
        <kbd>/</kbd>
      </label>
      <select class="btn ghost" id="sort" aria-label="Sort">
        <option value="code">Sort · Sheet no.</option>
        <option value="year">Sort · Year</option>
        <option value="title">Sort · A–Z</option>
        <option value="updated">Sort · Recently edited</option>
      </select>
      <button class="btn primary" id="new-btn" type="button">+ New case <kbd style="border-color:currentColor;color:inherit">N</kbd></button>
    </div>

    <nav class="filters" id="filters" aria-label="Filter by theme"></nav>

    <main class="grid" id="grid" aria-live="polite"></main>

    <footer class="legend">
      <span class="scalebar"><i></i> 0 — 100 — 200 m</span>
      <span>Saved in this browser · Export to keep a backup</span>
    </footer>
  </div>
</div>

    t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove("show"), 2400);
  }

  // ---------- Render ----------
  function matches(item) {
    if (ui.theme && !item.themes?.includes(ui.theme)) return false;
    if (!ui.q) return true;
    const hay = [item.title, item.city, item.country, item.site, item.year, item.designers, item.scale, item.brief,
      ...(item.links || []).map(l => l.label), ...(item.themes || []).map(t => THEMES[t])].join(" ").toLowerCase();
    return ui.q.toLowerCase().split(/\s+/).every(w => hay.includes(w));
  }
  function sorted(list) {
    const l = [...list];
    if (ui.sort === "year") l.sort((a, b) => firstYear(a.year) - firstYear(b.year));
    else if (ui.sort === "title") l.sort((a, b) => a.title.localeCompare(b.title));
    else if (ui.sort === "updated") l.sort((a, b) => (b.updated || "").localeCompare(a.updated || ""));
    else l.sort((a, b) => a.no - b.no);
    return l;
  }

  function renderFilters() {
    const counts = {};
    state.items.forEach(i => (i.themes || []).forEach(t => counts[t] = (counts[t] || 0) + 1));
    $("#filters").innerHTML =
      `<span class="eyebrow">Layers</span>` +
      `<button class="chip" type="button" data-theme="" aria-pressed="${!ui.theme}">All <span class="count">${state.items.length}</span></button>` +
      Object.entries(THEMES).map(([k, label]) =>
        `<button class="chip" type="button" data-theme="${k}" aria-pressed="${ui.theme === k}">${esc(label)} <span class="count">${counts[k] || 0}</span></button>`
      ).join("");
  }

  function renderGrid() {
    const list = sorted(state.items.filter(matches));
    $("#grid").innerHTML = list.length ? list.map(item => {
      const primary = item.themes?.[0] || "public-space";
      const n = (item.links || []).length;
      return `
      <button class="card" type="button" data-id="${item.id}">
        <div class="card-top"><span class="card-code">${code(item.no)}</span><span>${esc(item.coords || "")}</span></div>
        <div class="glyph">${glyphSvg(primary)}<span class="glyph-label">${esc(THEMES[primary] || "")}</span></div>
        <h3>${esc(item.title)}</h3>
        <div class="card-place">${esc([item.city, item.country].filter(Boolean).join(", "))}${item.year ? " · " + esc(item.year) : ""}</div>
        ${item.brief ? `<p class="card-brief">${esc(item.brief)}</p>` : ""}
        <div class="card-foot">
          <span>${n} ${n === 1 ? "source" : "sources"}</span>
          <span>${(item.themes || []).length} ${(item.themes || []).length === 1 ? "layer" : "layers"}</span>
        </div>
      </button>`;
    }).join("") : `<div class="empty">No sheets match${ui.q ? ` “${esc(ui.q)}”` : ""}${ui.theme ? ` in ${esc(THEMES[ui.theme])}` : ""}.</div>`;
  }

  function renderTitleBlock() {
    $("#tb-count").textContent = String(state.items.length).padStart(2, "0");
    $("#tb-sources").textContent = String(state.items.reduce((n, i) => n + (i.links || []).length, 0)).padStart(2, "0");
    const latest = state.items.map(i => i.updated).filter(Boolean).sort().pop();
    $("#tb-rev").textContent = latest ? fmtDate(latest) : "—";
  }

  function render() { renderFilters(); renderGrid(); renderTitleBlock(); }

  // ---------- Detail sheet ----------
  const dlg = $("#dlg");
  let currentId = null;

  function openSheet(id) {
    const item = byId(id);
    if (!item) return;
    currentId = id;
    const primary = item.themes?.[0] || "public-space";
    const fact = (k, v) => v ? `<div><dt>${k}</dt><dd>${v}</dd></div>` : "";
    dlg.innerHTML = `
      <div class="dlg-head">
        <div>
          <div class="eyebrow">${code(item.no)} · ${esc([item.city, item.country].filter(Boolean).join(", "))}</div>
          <h2 id="dlg-title">${esc(item.title)}</h2>
          ${item.brief ? `<p class="lede" style="max-width:60ch">${esc(item.brief)}</p>` : ""}
        </div>
        <div class="dlg-actions">
          <button class="btn small ghost" type="button" data-act="edit">Edit</button>
          <button class="btn small ghost close-x" type="button" data-act="close" aria-label="Close">×</button>
        </div>
      </div>
      <div class="dlg-body">
        <div class="dlg-col">
          <div class="glyph dlg-glyph">${glyphSvg(primary)}<span class="glyph-label">${esc(THEMES[primary] || "")}</span></div>
          <h4 class="section-title">Core facts</h4>
          <dl class="facts">
            ${fact("Location", esc([item.city, item.country].filter(Boolean).join(", ")))}
            ${fact("Site", esc(item.site))}
            ${fact("Year", esc(item.year))}
            ${fact("Designers", esc(item.designers))}
            ${fact("Scale", esc(item.scale))}
            ${fact("Coords", esc(item.coords))}
            ${fact("Themes", item.themes?.length ? `<span class="tags">${item.themes.map(t => `<span class="tag">${esc(THEMES[t] || t)}</span>`).join("")}</span>` : "")}
          </dl>
        </div>
        <div class="dlg-col">
          <h4 class="section-title"><span>Links &amp; reading</span><span>${(item.links || []).length}</span></h4>
          <ul class="links">
            ${(item.links || []).map((l, i) => `
              <li>
                <span class="idx">${String(i + 1).padStart(2, "0")}</span>
                <a href="${esc(l.url)}" target="_blank" rel="noopener noreferrer"><span class="link-label">${esc(l.label || host(l.url))}</span><span class="link-host">${esc(host(l.url))} ↗</span></a>
                <button class="icon-btn" type="button" data-act="del-link" data-i="${i}" aria-label="Remove link">×</button>
              </li>`).join("") || `<li style="color:var(--ink-faint);font-family:var(--mono);font-size:12px">No links yet.</li>`}
          </ul>
          <form class="add-link" id="add-link">
            <input class="field" name="label" placeholder="Title (optional)" aria-label="Link title">
            <input class="field" name="url" placeholder="https://…" aria-label="Link URL" required>
            <button class="btn small" type="submit" style="height:34px">Add</button>
          </form>
        </div>
      </div>`;
    if (!dlg.open) dlg.showModal();
    dlg.scrollTop = 0;

    $("#add-link", dlg).addEventListener("submit", (e) => {
      e.preventDefault();
      const f = new FormData(e.target);
      let raw = String(f.get("url") || "").trim();
      if (raw && !/^[a-z]+:\/\//i.test(raw)) raw = "https://" + raw;
      const url = safeUrl(raw);
      if (!url) { toast("That doesn't look like a web address."); return; }
      item.links = [...(item.links || []), { label: String(f.get("label") || "").trim(), url }];
      item.updated = now();
      save(); render();
      openSheet(item.id);
      $("#add-link input[name=url]", dlg)?.focus();
    });
  }

  function openForm(id) {
    const item = id ? byId(id) : null;
    currentId = id || null;
    const v = (k) => esc(item?.[k] || "");
    dlg.innerHTML = `
      <div class="dlg-head">
        <div>
          <div class="eyebrow">${item ? code(item.no) + " · Revise sheet" : code(state.nextNo) + " · New sheet"}</div>
          <h2 id="dlg-title">${item ? esc(item.title) : "New case study"}</h2>
        </div>
        <div class="dlg-actions">
          <button class="btn small ghost close-x" type="button" data-act="${item ? "back" : "close"}" aria-label="Close">×</button>
        </div>
      </div>
      <form class="form" id="case-form">
        <label class="full"><span>Title <b class="req">*</b></span><input class="field" name="title" required value="${v("title")}" placeholder="e.g. Superkilen"></label>
        <label><span>City / place</span><input class="field" name="city" value="${v("city")}" placeholder="Copenhagen"></label>
        <label><span>Country</span><input class="field" name="country" value="${v("country")}" placeholder="Denmark"></label>
        <label class="full"><span>Site / address</span><input class="field" name="site" value="${v("site")}" placeholder="Nørrebro"></label>
        <label><span>Year</span><input class="field" name="year" value="${v("year")}" placeholder="2012"></label>
        <label><span>Coordinates</span><input class="field" name="coords" value="${v("coords")}" placeholder="55.70° N, 12.54° E"></label>
        <label class="full"><span>Architects / designers / agencies</span><input class="field" name="designers" value="${v("designers")}" placeholder="BIG; Topotek 1; Superflex"></label>
        <label class="full"><span>Scale</span><input class="field" name="scale" value="${v("scale")}" placeholder="750 m urban park, 3 ha"></label>
        <label class="full"><span>One-line description</span><textarea class="field" name="brief" rows="2" placeholder="What it is, in a sentence.">${v("brief")}</textarea></label>
        <fieldset class="full">
          <legend>Themes · the first one picked sets the drawing</legend>
          <div class="theme-picks">
            ${Object.entries(THEMES).map(([k, label]) => `
              <label><input type="checkbox" name="themes" value="${k}" ${item?.themes?.includes(k) ? "checked" : ""}><span class="chip">${esc(label)}</span></label>`).join("")}
          </div>
        </fieldset>
        <div class="form-foot">
          ${item ? `<button class="btn danger" type="button" data-act="delete" style="margin-right:auto">Delete</button>` : ""}
          <button class="btn ghost" type="button" data-act="${item ? "back" : "close"}">Cancel</button>
          <button class="btn primary" type="submit">${item ? "Save changes" : "Add to casebook"}</button>
        </div>
      </form>`;
    if (!dlg.open) dlg.showModal();
    dlg.scrollTop = 0;
    $("input[name=title]", dlg).focus();

    // Keep check order so the first ticked theme stays the primary one.
    const order = [...(item?.themes || [])];
    dlg.querySelectorAll("input[name=themes]").forEach(cb => cb.addEventListener("change", () => {
      const i = order.indexOf(cb.value);
      if (cb.checked && i < 0) order.push(cb.value);
      if (!cb.checked && i >= 0) order.splice(i, 1);
    }));

    $("#case-form", dlg).addEventListener("submit", (e) => {
      e.preventDefault();
      const f = new FormData(e.target);
      const data = {};
      ["title", "city", "country", "site", "year", "coords", "designers", "scale", "brief"].forEach(k => data[k] = String(f.get(k) || "").trim());
      data.themes = order.filter(t => THEMES[t]);
      data.updated = now();
      if (item) {
        Object.assign(item, data);
        save(); render();
        openSheet(item.id);
        toast("Sheet revised.");
      } else {
        const fresh = { id: uid(), no: state.nextNo++, links: [], ...data };
        state.items.push(fresh);
        save(); render();
        openSheet(fresh.id);
        toast(`${code(fresh.no)} added.`);
      }
    });
  }

  dlg.addEventListener("click", (e) => {
    if (e.target === dlg) { dlg.close(); return; } // backdrop click
    const btn = e.target.closest("[data-act]");
    if (!btn) return;
    const act = btn.dataset.act;
    const item = currentId && byId(currentId);
    if (act === "close") dlg.close();
    else if (act === "edit" && item) openForm(item.id);
    else if (act === "back" && item) openSheet(item.id);
    else if (act === "del-link" && item) {
      item.links.splice(+btn.dataset.i, 1);
      item.updated = now();
      save(); render(); openSheet(item.id);
    } else if (act === "delete" && item) {
      if (confirm(`Delete “${item.title}” and its sources? This can't be undone (unless you've exported a backup).`)) {
        state.items = state.items.filter(i => i.id !== item.id);
        save(); render(); dlg.close();
        toast("Sheet removed.");
      }
    }
  });
  dlg.addEventListener("close", () => { currentId = null; });

  // ---------- Controls ----------
  $("#grid").addEventListener("click", (e) => {
    const card = e.target.closest(".card");
    if (card) openSheet(card.dataset.id);
  });
  $("#filters").addEventListener("click", (e) => {
    const chip = e.target.closest(".chip");
    if (!chip) return;
    ui.theme = chip.dataset.theme || null;
    renderFilters(); renderGrid();
  });
  $("#search").addEventListener("input", (e) => { ui.q = e.target.value.trim(); renderGrid(); });
  $("#sort").addEventListener("change", (e) => { ui.sort = e.target.value; renderGrid(); });
  $("#new-btn").addEventListener("click", () => openForm(null));

  document.addEventListener("keydown", (e) => {
    if (dlg.open || e.metaKey || e.ctrlKey || e.altKey) return;
    if (/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName)) return;
    if (e.key === "/") { e.preventDefault(); $("#search").focus(); }
    else if (e.key.toLowerCase() === "n") { e.preventDefault(); openForm(null); }
  });

  // Theme
  function applyTheme(t) {
    document.documentElement.dataset.theme = t;
    $("#theme-toggle").textContent = t === "vellum" ? "Blueprint" : "Vellum";
  }
  let theme = "blueprint";
  try { theme = localStorage.getItem(THEME_KEY) || "blueprint"; } catch (e) {}
  applyTheme(theme);
  $("#theme-toggle").addEventListener("click", () => {
    theme = theme === "vellum" ? "blueprint" : "vellum";
    applyTheme(theme);
    try { localStorage.setItem(THEME_KEY, theme); } catch (e) {}
  });

  // Export / import
  // On claude.ai the viewer saves through the downloads capability; opened as a
  // plain file, the page falls back to an ordinary download link.
  let downloads = null;
  if (window.claude?.use) window.claude.use("downloads").then(d => { downloads = d; }).catch(() => {});

  $("#export-btn").addEventListener("click", async () => {
    const filename = `casebook-${new Date().toISOString().slice(0, 10)}.json`;
    if (downloads) {
      try {
        await downloads.save({ filename, data: JSON.stringify(state, null, 2) });
        toast("Backup exported.");
      } catch (err) {
        toast(err?.code === "declined" ? "Export cancelled." : "Couldn't export here. Try again in a moment.");
      }
      return;
    }
    const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    toast("Backup exported.");
  });
  $("#import-btn").addEventListener("click", () => $("#import-file").click());
  $("#import-file").addEventListener("change", async (e) => {
    const file = e.target.files?.[0];
    e.target.value = "";
    if (!file) return;
    try {
      const data = JSON.parse(await file.text());
      if (!data || !Array.isArray(data.items)) throw new Error("bad");
      if (!confirm(`Replace your current ${state.items.length} sheets with ${data.items.length} from “${file.name}”?`)) return;
      data.items = data.items.filter(i => i && i.title).map((i, n) => ({
        id: i.id || uid(), no: +i.no || n + 1, title: String(i.title), city: i.city || "", country: i.country || "",
        site: i.site || "", year: i.year || "", designers: i.designers || "", scale: i.scale || "", coords: i.coords || "", brief: i.brief || "",
        updated: i.updated || now(),
        themes: Array.isArray(i.themes) ? i.themes.filter(t => THEMES[t]) : [],
        links: Array.isArray(i.links) ? i.links.filter(l => l && safeUrl(String(l.url || ""))).map(l => ({ label: String(l.label || ""), url: safeUrl(String(l.url)) })) : [],
      }));
      data.nextNo = Math.max(+data.nextNo || 0, ...data.items.map(i => i.no + 1), 1);
      state = data;
      save(); render();
      toast(`Imported ${state.items.length} sheets.`);
    } catch (err) {
      toast("Couldn't read that file. Is it a Casebook export?");
    }
  });

  render();
})();
</script>
</body>
</html>
