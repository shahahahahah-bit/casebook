<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Casebook</title>
<meta name="description" content="A field of urban case studies, placed by where they are in the world.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%230c2217'/%3E%3Crect x='5' y='5' width='6' height='6' fill='%23ffd36b'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
  :root {
    --ground: #0c2217;
    --ground-2: #102b1e;
    --panel: #0f281c;
    --panel-2: #143324;
    --ink: #ebf2e8;
    --ink-2: #b7cabb;
    --ink-3: #7e9a85;
    --line: rgba(235, 242, 232, 0.11);
    --line-2: rgba(235, 242, 232, 0.26);
    --glass: rgba(14, 38, 26, 0.86);
    --accent: #f3e7c2;
    --danger: #ff9a86;
    --mobility: #63c7ff;
    --housing: #ff8562;
    --public-space: #ffd36b;
    --landscape: #b9ef6e;
    --reuse: #d59dff;
    --regional: #ff9fcd;
    --serif: "Instrument Serif", Georgia, serif;
    --sans: "Instrument Sans", system-ui, -apple-system, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
    --ease: cubic-bezier(.2, .7, .2, 1);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.5;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  a { color: inherit; }
  ::selection { background: var(--accent); color: var(--ground); }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* ---------- Field ---------- */
  #field {
    position: fixed; inset: 0;
    overflow: hidden;
    cursor: grab;
    touch-action: none;
    background:
      radial-gradient(1200px 800px at 30% 20%, rgba(255,255,255,.025), transparent 60%),
      var(--ground);
    outline: none;
  }
  #field.dragging { cursor: grabbing; }
  #deco { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
  #terr { transition: opacity .45s ease; }
  #terr.fade { opacity: 0; }
  .terr { fill-opacity: .11; stroke-opacity: .32; stroke-width: 1; }
  .guide { stroke: var(--line); stroke-width: 1; fill: none; }
  .guide.strong { stroke: var(--line-2); }
  .guide-label { fill: var(--ink-3); font-family: var(--mono); font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; }
  .big-label { font-family: var(--serif); font-style: italic; font-size: 44px; fill: var(--ink); opacity: .13; }
  .theme-label { font-family: var(--serif); font-style: italic; font-size: 26px; }
  #pts { position: absolute; left: 0; top: 0; }
  .pt {
    position: absolute; left: 0; top: 0;
    border: 0; padding: 0; background: none;
    width: 0; height: 0;
    --c: var(--ink);
  }
  #field.anim .pt { transition: transform .75s var(--ease), opacity .3s; }
  .pt .sq {
    position: absolute; left: -5px; top: -5px;
    width: 10px; height: 10px;
    background: var(--c);
    box-shadow: 0 0 0 0 transparent;
    transition: transform .15s, box-shadow .2s;
  }
  .pt.new .sq::after {
    content: ""; position: absolute; inset: -5px;
    border: 1px solid var(--c); opacity: .8;
  }
  .pt .lb {
    position: absolute; left: 10px; top: -10px;
    white-space: nowrap;
    text-align: left;
    pointer-events: none;
    line-height: 1.15;
  }
  .pt .t { display: block; font-size: 12.5px; font-weight: 500; color: var(--ink); text-shadow: 0 1px 6px var(--ground), 0 0 2px var(--ground); }
  .pt .m { display: block; font-family: var(--mono); font-size: 9.5px; letter-spacing: .06em; color: var(--ink-3); text-transform: uppercase; text-shadow: 0 0 4px var(--ground); }
  .pt .m b { color: var(--c); font-weight: 500; }
  .pt.nolabel .lb { visibility: hidden; }
  .pt:hover .sq, .pt:focus-visible .sq, .pt.sel .sq { transform: scale(1.5); box-shadow: 0 0 0 4px rgba(12,34,23,.9), 0 0 0 5px var(--c); }
  .pt:hover .lb, .pt:focus-visible .lb, .pt.sel .lb { visibility: visible; z-index: 2; }
  .pt:hover, .pt:focus-visible, .pt.sel { z-index: 5; outline: none; }
  .pt.dim { opacity: .14; }
  .pt.dim .lb { visibility: hidden; }

  /* ---------- Chrome ---------- */
  .glass {
    background: var(--glass);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid var(--line);
  }
  .brand {
    position: fixed; top: 18px; left: 20px; z-index: 10;
    pointer-events: none;
  }
  .brand h1 {
    margin: 0;
    font-family: var(--serif);
    font-weight: 400;
    font-size: 40px;
    line-height: .9;
    letter-spacing: -.01em;
  }
  .brand h1 i { color: var(--accent); }
  .brand p {
    margin: 6px 0 0;
    font-family: var(--mono);
    font-size: 10.5px;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--ink-3);
  }
  .topnav {
    position: fixed; top: 16px; right: 16px; z-index: 10;
    display: flex; gap: 4px; padding: 4px;
  }
  .navbtn {
    border: 0; background: none;
    font-family: var(--mono); font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase;
    padding: 8px 12px; color: var(--ink-2);
    display: inline-flex; align-items: center; gap: 6px;
  }
  .navbtn:hover { color: var(--ink); background: rgba(255,255,255,.05); }
  .navbtn[aria-pressed="true"] { color: var(--ground); background: var(--ink); }
  .navbtn .badge {
    font-size: 10px; padding: 0 5px; line-height: 16px;
    background: var(--accent); color: var(--ground);
  }

  .axis-card {
    position: fixed; left: 16px; bottom: 16px; z-index: 10;
    padding: 12px 14px 12px;
    display: grid; gap: 10px;
    width: 196px;
  }
  .axis-card .lbl { font-family: var(--mono); font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); }
  .axis-glyph { display: flex; align-items: flex-end; gap: 10px; height: 46px; }
  .axis-glyph svg { width: 54px; height: 46px; color: var(--ink-2); flex: none; }
  .axis-glyph span { font-family: var(--mono); font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); line-height: 1.4; }
  .seg { display: grid; grid-template-columns: repeat(3, 1fr); border: 1px solid var(--line-2); }
  .seg button {
    border: 0; background: none; padding: 7px 0;
    font-family: var(--mono); font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-2);
  }
  .seg button + button { border-left: 1px solid var(--line-2); }
  .seg button:hover { color: var(--ink); }
  .seg button[aria-pressed="true"] { background: var(--ink); color: var(--ground); }

  .bar {
    position: fixed; left: 228px; right: 16px; bottom: 16px; z-index: 10;
    display: flex; align-items: center; gap: 8px;
    padding: 6px;
    max-width: 860px; margin-left: auto;
  }
  .search { flex: 1; display: flex; align-items: center; gap: 8px; padding: 0 10px; min-width: 0; }
  .search svg { flex: none; color: var(--ink-3); }
  .search input { flex: 1; min-width: 0; border: 0; background: none; outline: none; height: 34px; font-size: 14px; }
  .search input::placeholder { color: var(--ink-3); }
  .count { font-family: var(--mono); font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); white-space: nowrap; padding: 0 6px; }
  .btn {
    height: 34px; padding: 0 12px;
    border: 1px solid var(--line-2); background: none;
    font-family: var(--mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase;
    display: inline-flex; align-items: center; gap: 7px; white-space: nowrap;
  }
  .btn:hover { background: var(--ink); color: var(--ground); border-color: var(--ink); }
  .btn.on { background: var(--ink); color: var(--ground); border-color: var(--ink); }
  .btn.icon { width: 34px; padding: 0; justify-content: center; font-size: 16px; }
  .btn.primary { background: var(--accent); color: var(--ground); border-color: var(--accent); }
  .btn.danger { border-color: var(--danger); color: var(--danger); }
  .btn.danger:hover { background: var(--danger); color: var(--ground); }
  .btn .n { background: var(--accent); color: var(--ground); padding: 0 5px; line-height: 16px; font-size: 10px; }
  .zoom { display: flex; gap: 4px; }

  /* Filters tray */
  .tray {
    position: fixed; right: 16px; bottom: 70px; z-index: 11;
    width: min(560px, calc(100vw - 32px));
    max-height: calc(100vh - 150px); overflow: auto;
    padding: 16px 18px 18px;
    display: none;
  }
  .tray.open { display: block; animation: rise .2s var(--ease); }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } }
  .tray h3, .sheet h3 {
    margin: 14px 0 8px;
    font-family: var(--mono); font-weight: 400; font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3);
  }
  .tray h3:first-child { margin-top: 0; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    border: 1px solid var(--line-2); background: none;
    padding: 5px 10px;
    font-size: 13px;
    display: inline-flex; align-items: center; gap: 7px;
    color: var(--ink-2);
  }
  .chip i { width: 9px; height: 9px; background: var(--c, var(--ink-3)); flex: none; }
  .chip .k { font-family: var(--mono); font-size: 10.5px; color: var(--ink-3); }
  .chip:hover { color: var(--ink); border-color: var(--ink-2); }
  .chip[aria-pressed="true"] { background: var(--ink); color: var(--ground); border-color: var(--ink); }
  .chip[aria-pressed="true"] .k { color: var(--ground); opacity: .6; }
  .range { display: grid; gap: 6px; }
  .range-vals { display: flex; justify-content: space-between; font-family: var(--mono); font-size: 12px; color: var(--ink-2); }
  .dual { position: relative; height: 26px; }
  .dual input { position: absolute; inset: 0; width: 100%; margin: 0; appearance: none; -webkit-appearance: none; background: none; pointer-events: none; }
  .dual::before { content: ""; position: absolute; left: 0; right: 0; top: 12px; height: 2px; background: var(--line-2); }
  .dual .fill { position: absolute; top: 12px; height: 2px; background: var(--accent); }
  .dual input::-webkit-slider-thumb { -webkit-appearance: none; pointer-events: auto; width: 16px; height: 16px; background: var(--accent); border: 2px solid var(--ground); cursor: pointer; }
  .dual input::-moz-range-thumb { pointer-events: auto; width: 14px; height: 14px; background: var(--accent); border: 2px solid var(--ground); border-radius: 0; cursor: pointer; }
  .tray-foot { display: flex; justify-content: flex-end; margin-top: 16px; }

  /* Detail panel */
  .panel {
    position: fixed; top: 0; right: 0; bottom: 0; z-index: 20;
    width: min(440px, 100vw);
    background: var(--panel);
    border-left: 1px solid var(--line-2);
    transform: translateX(102%);
    transition: transform .35s var(--ease);
    overflow-y: auto;
    overscroll-behavior: contain;
  }
  .panel.open { transform: none; box-shadow: -30px 0 60px rgba(0,0,0,.35); }
  .ph { position: relative; aspect-ratio: 16 / 10; background: var(--panel-2); overflow: hidden; }
  .ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .ph .glyph { position: absolute; inset: 0; display: grid; place-items: center; color: var(--c); }
  .ph .glyph svg { width: 56%; height: 70%; overflow: visible; }
  .credit {
    position: absolute; left: 0; right: 0; bottom: 0;
    padding: 18px 14px 8px;
    background: linear-gradient(transparent, rgba(0,0,0,.6));
    font-family: var(--mono); font-size: 10px; letter-spacing: .04em; color: rgba(255,255,255,.85);
  }
  .panel-top { position: absolute; top: 12px; right: 12px; display: flex; gap: 6px; z-index: 2; }
  .panel-top .btn { background: var(--glass); backdrop-filter: blur(8px); border-color: var(--line-2); }
  .panel-top .btn:hover { background: var(--ink); }
  .pbody { padding: 20px 22px 30px; }
  .kicker { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-family: var(--mono); font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); }
  .stage { padding: 2px 7px; border: 1px solid var(--line-2); color: var(--ink-2); }
  .stage.built { background: var(--ink); color: var(--ground); border-color: var(--ink); }
  .stage.planned { border-style: dashed; }
  .newtag { padding: 2px 7px; background: var(--accent); color: var(--ground); }
  .pbody h2 { margin: 10px 0 6px; font-family: var(--serif); font-weight: 400; font-size: 38px; line-height: 1; letter-spacing: -.01em; }
  .place { color: var(--ink-2); margin: 0 0 14px; }
  .brief { font-size: 16px; line-height: 1.5; margin: 0 0 22px; color: var(--ink); }
  .facts { margin: 0 0 24px; border-top: 1px solid var(--line); }
  .facts div { display: grid; grid-template-columns: 96px 1fr; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--line); }
  .facts dt { font-family: var(--mono); font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); padding-top: 3px; }
  .facts dd { margin: 0; font-size: 14px; overflow-wrap: anywhere; }
  .facts .note { display: block; color: var(--ink-3); font-size: 12px; margin-top: 2px; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .tag { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; }
  .tag i { width: 8px; height: 8px; background: var(--c); }
  .links { list-style: none; margin: 0 0 22px; padding: 0; border-top: 1px solid var(--line); }
  .links li { border-bottom: 1px solid var(--line); }
  .links a { display: block; padding: 10px 0; text-decoration: none; }
  .links a:hover .ll { text-decoration: underline; text-underline-offset: 3px; }
  .links .lh { display: block; font-family: var(--mono); font-size: 10.5px; color: var(--ink-3); }
  .pnav { display: flex; justify-content: space-between; gap: 8px; }

  /* Sheets (Latest / Index / About) */
  .sheet {
    position: fixed; top: 64px; right: 16px; z-index: 15;
    width: min(640px, calc(100vw - 32px));
    max-height: calc(100vh - 150px);
    display: none; flex-direction: column;
  }
  .sheet.open { display: flex; animation: rise .2s var(--ease); }
  .sheet, .tray { background: var(--panel); box-shadow: 0 24px 60px rgba(0, 0, 0, .4); }
  .idx th { background: var(--panel); }
  .sheet-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 16px 18px 12px; border-bottom: 1px solid var(--line); }
  .sheet-head h2 { margin: 0; font-family: var(--serif); font-weight: 400; font-size: 30px; line-height: 1; }
  .sheet-head p { margin: 4px 0 0; color: var(--ink-3); font-size: 13px; }
  .sheet-body { overflow-y: auto; padding: 6px 18px 18px; overscroll-behavior: contain; }
  .tabs { display: flex; gap: 4px; padding: 10px 18px 0; }
  .tabs .navbtn { padding: 6px 10px; }
  .day { margin: 16px 0 4px; font-family: var(--mono); font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); }
  .row {
    display: grid; grid-template-columns: 64px 1fr; gap: 12px; align-items: center;
    width: 100%; text-align: left; background: none; border: 0; border-bottom: 1px solid var(--line);
    padding: 10px 0;
  }
  .row:hover .rt { text-decoration: underline; text-underline-offset: 3px; }
  .thumb { width: 64px; height: 46px; background: var(--panel-2); overflow: hidden; display: grid; place-items: center; color: var(--c); }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .thumb svg { width: 70%; height: 70%; overflow: visible; }
  .rt { display: block; font-weight: 500; }
  .rm { display: flex; flex-wrap: wrap; gap: 4px 10px; font-family: var(--mono); font-size: 10.5px; letter-spacing: .04em; color: var(--ink-3); margin-top: 2px; }
  .lane { color: var(--accent); }
  .empty { padding: 30px 0; color: var(--ink-3); font-size: 14px; }
  table.idx { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  .idx th { text-align: left; font-family: var(--mono); font-weight: 400; font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); padding: 10px 8px 8px 0; position: sticky; top: 0; background: var(--glass); cursor: pointer; white-space: nowrap; }
  .idx th[aria-sort] { color: var(--ink); }
  .idx td { padding: 9px 8px 9px 0; border-top: 1px solid var(--line); vertical-align: top; }
  .idx tr { cursor: pointer; }
  .idx tbody tr:hover td { background: rgba(255,255,255,.03); }
  .idx .no { font-family: var(--mono); font-size: 11px; color: var(--ink-3); }
  .idx .dot { display: inline-block; width: 8px; height: 8px; background: var(--c); margin-right: 8px; }
  .about p { color: var(--ink-2); margin: 10px 0; }
  .about strong { color: var(--ink); font-weight: 500; }
  .about .actions { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0 4px; }
  .legend { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 6px 14px; margin: 8px 0; }

  /* Hover card */
  .hover {
    position: fixed; z-index: 12; pointer-events: none;
    width: 230px; overflow: hidden;
    opacity: 0; transform: translateY(4px);
    transition: opacity .15s, transform .15s;
  }
  .hover.show { opacity: 1; transform: none; }
  .hover .ph { aspect-ratio: 16 / 10; }
  .hover .hb { padding: 9px 11px 10px; }
  .hover .ht { font-family: var(--serif); font-size: 20px; line-height: 1.05; }
  .hover .hm { font-family: var(--mono); font-size: 10px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); margin-top: 4px; }

  /* Edit dialog */
  dialog {
    width: min(640px, calc(100vw - 24px)); max-height: calc(100vh - 32px);
    padding: 0; border: 1px solid var(--line-2);
    background: var(--panel); color: var(--ink);
  }
  dialog::backdrop { background: rgba(0, 10, 5, .6); backdrop-filter: blur(3px); }
  .form { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 14px; padding: 18px 20px 20px; }
  .form label { display: grid; gap: 4px; }
  .form label > span, .form legend { font-family: var(--mono); font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); }
  .form .full { grid-column: 1 / -1; }
  .form fieldset { border: 0; margin: 0; padding: 0; }
  .field { height: 36px; border: 1px solid var(--line-2); background: var(--ground-2); padding: 0 10px; outline: none; min-width: 0; font-size: 14px; }
  .field:focus { border-color: var(--ink-2); }
  textarea.field { height: auto; padding: 8px 10px; resize: vertical; }
  select.field option { background: var(--panel); }
  .picks { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .picks input { position: absolute; opacity: 0; pointer-events: none; }
  .picks input:checked + .chip { background: var(--ink); color: var(--ground); border-color: var(--ink); }
  .picks input:focus-visible + .chip { outline: 2px solid var(--accent); outline-offset: 2px; }
  .form-foot { grid-column: 1 / -1; display: flex; gap: 8px; justify-content: flex-end; margin-top: 4px; }
  .hint { grid-column: 1 / -1; margin: -4px 0 0; font-size: 12px; color: var(--ink-3); }

  .toast {
    position: fixed; left: 50%; top: 18px; z-index: 40;
    transform: translate(-50%, -10px); opacity: 0; pointer-events: none;
    background: var(--ink); color: var(--ground);
    font-family: var(--mono); font-size: 12px; padding: 9px 14px;
    transition: opacity .2s, transform .2s;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  .loading { position: fixed; inset: 0; display: grid; place-items: center; font-family: var(--mono); font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); z-index: 5; text-align: center; padding: 20px; }

  @media (max-width: 760px) {
    .brand { top: 14px; left: 14px; }
    .brand h1 { font-size: 30px; }
    .brand p { display: none; }
    .topnav { top: 10px; right: 10px; }
    .navbtn { padding: 7px 8px; font-size: 10.5px; }
    .axis-card { left: 10px; right: 10px; bottom: 62px; width: auto; padding: 8px; grid-template-columns: auto 1fr; align-items: center; gap: 10px; }
    .axis-glyph { display: none; }
    .bar { left: 10px; right: 10px; bottom: 10px; }
    .count, .zoom .fit { display: none; }
    .tray { right: 10px; bottom: 112px; width: calc(100vw - 20px); max-height: calc(100vh - 190px); }
    .sheet { top: 56px; right: 10px; width: calc(100vw - 20px); max-height: calc(100vh - 186px); }
    .panel { top: auto; height: 82vh; width: 100vw; border-left: 0; border-top: 1px solid var(--line-2); transform: translateY(102%); }
    .panel.open { transform: none; }
    .form { grid-template-columns: 1fr; }
    .hover { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; animation: none !important; }
  }
</style>
</head>
<body>
<div id="field" tabindex="0" aria-label="Case study field. Drag to move, scroll or pinch to zoom.">

<script>
(() => {
  const OVERLAY_KEY = "casebook.v2.changes";
  const DAY = 86400000;
  const NEW_DAYS = 7;

  const THEMES = {
    "mobility":     "Mobility",
    "housing":      "Housing",
    "public-space": "Public space",
    "landscape":    "Landscape & water",
    "reuse":        "Adaptive reuse",
    "regional":     "Regional planning",
  };
  const THEME_ORDER = Object.keys(THEMES);
  const STAGES = { "built": "Built", "in-progress": "In progress", "planned": "Planned" };
  const REGIONS = ["North America", "Latin America", "Europe", "Africa", "Asia", "Oceania"];
  const SOURCES = { "archdaily.com": "ArchDaily", "dezeen.com": "Dezeen", "planetizen.com": "Planetizen", "urbanize.city": "Urbanize Atlanta", "urbanomnibus.net": "Urban Omnibus" };
  const LANES = { large: "Large-scale", small: "Small-scale" };
  const col = (t) => `var(--${THEMES[t] ? t : "public-space"})`;

  // Line drawings, one per theme, for projects without a photo. Drawn on a 120 × 80 sheet.
  const GLYPHS = {
    "mobility": `
      <path d="M4 66 C 30 66, 40 20, 70 22 S 108 40, 116 14"/>
      <path d="M4 58 C 28 58, 36 12, 70 14 S 104 32, 116 6" stroke-dasharray="2 3"/>
      ${[[18,62],[46,36],[72,18],[100,28]].map(([x,y])=>`<circle cx="${x}" cy="${y}" r="3.2" fill="var(--panel-2)"/>`).join("")}`,
    "housing": `
      <rect x="10" y="44" width="22" height="26"/><rect x="32" y="34" width="22" height="36"/>
      <rect x="54" y="40" width="22" height="30"/><rect x="76" y="26" width="22" height="44"/>
      <rect x="98" y="48" width="14" height="22"/>
      <path d="M32 34 L43 24 L54 34 M76 26 L87 16 L98 26"/><path d="M4 70 H116"/>`,
    "public-space": `
      <rect x="20" y="8" width="80" height="64"/>
      <rect x="34" y="20" width="52" height="40" stroke-dasharray="3 3"/>
      <path d="M20 8 L100 72 M100 8 L20 72" stroke-opacity=".45"/>
      <circle cx="60" cy="40" r="7"/>`,
    "landscape": `
      <path d="M8 46 C 20 20, 54 10, 76 18 S 116 36, 108 54 S 70 76, 40 70 S 2 62, 8 46 Z"/>
      <path d="M22 46 C 30 30, 54 22, 72 28 S 100 40, 94 52 S 66 66, 44 62 S 18 56, 22 46 Z"/>
      <path d="M38 46 C 42 38, 56 32, 68 36 S 82 44, 78 50 S 62 58, 50 56 S 36 52, 38 46 Z"/>`,
    "reuse": `
      <path d="M4 30 H116 M4 36 H116"/>
      ${[14,38,62,86,110].map(x=>`<path d="M${x} 36 V74 M${x-3} 74 h6"/>`).join("")}
      ${[20,32,50,70,78,96].map((x,i)=>`<path d="M${x} 30 c -2 -${6+i%3*3}, 2 -${6+i%3*3}, 0 -${10+i%3*4}"/>`).join("")}`,
    "regional": `
      <circle cx="30" cy="54" r="10"/><circle cx="30" cy="54" r="3" fill="currentColor"/>
      <path d="M38 48 L112 10 M40 52 L116 36 M38 60 L110 70 M24 46 L12 6 M36 46 L62 4"/>`,
  };
  const glyph = (t) => `<svg viewBox="0 0 120 80" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${GLYPHS[t] || GLYPHS["public-space"]}</svg>`;

  // ---------- Helpers ----------
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => [...r.querySelectorAll(s)];
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const code = (n) => "CS-" + String(n).padStart(2, "0");
  const primary = (it) => (it.themes && THEMES[it.themes[0]]) ? it.themes[0] : "public-space";
  const host = (u) => { try { return new URL(u).hostname.replace(/^www\./, ""); } catch (e) { return ""; } };
  const sourceOf = (it) => {
    const h = host(it.links?.[0]?.url || "");
    const k = Object.keys(SOURCES).find(s => h.endsWith(s));
    return k ? SOURCES[k] : null;
  };
  const safeUrl = (u) => { try { const x = new URL(String(u).trim()); return /^https?:$/.test(x.protocol) ? x.href : null; } catch (e) { return null; } };
  const firstYear = (y) => parseInt(String(y || "").match(/\d{4}/)?.[0] || "", 10) || null;
  const isNew = (it) => it.origin !== "original" && it.added && (Date.now() - Date.parse(it.added)) < NEW_DAYS * DAY;
  const placeOf = (it) => [it.city, it.country].filter(Boolean).join(", ");
  let toastTimer;
  function toast(msg) {
    const t = $("#toast"); t.textContent = msg; t.classList.add("show");
    clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 2600);
  }
  function photo(it, cls = "ph") {
    const c = col(primary(it));
    const g = `<div class="glyph" style="--c:${c}">${glyph(primary(it))}</div>`;
    if (!it.image?.url) return `<div class="${cls}" style="--c:${c}">${g}</div>`;
    return `<div class="${cls}" style="--c:${c}">${g}<img src="${esc(it.image.url)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">${cls === "ph" && it.image.credit ? `<div class="credit">Image: ${esc(it.image.credit)}</div>` : ""}</div>`;
  }

  // ---------- Data ----------
  let base = [];
  let skipped = { days: [] };
  let overlay = { added: [], edits: {}, removed: [] };
  let items = [];
  const byId = (id) => items.find(i => i.id === id);

  function loadOverlay() {
    try {
      const o = JSON.parse(localStorage.getItem(OVERLAY_KEY) || "null");
      if (o && Array.isArray(o.added)) overlay = { added: o.added, edits: o.edits || {}, removed: o.removed || [] };
    } catch (e) {}
  }
  function saveOverlay() {
    try { localStorage.setItem(OVERLAY_KEY, JSON.stringify(overlay)); }
    catch (e) { toast("Couldn't save in this browser. Use Export to keep a copy."); }
  }
  // Sheets added by hand in the previous version of the site carry over once.
  function migrateV1() {
    try {
      if (localStorage.getItem("casebook.v2.migrated")) return;
      const old = JSON.parse(localStorage.getItem("casebook.v1") || "null");
      const titles = new Set(base.map(b => b.title));
      (old?.items || []).filter(i => i?.title && !titles.has(i.title) && !overlay.added.some(a => a.title === i.title)).forEach(i => {
        overlay.added.push({
          id: "mine-" + Math.random().toString(36).slice(2, 9), title: i.title, city: i.city || "", country: i.country || "", site: i.site || "",
          year: i.year || "", axisYear: firstYear(i.year), stage: "built", designers: i.designers || "", scale: i.scale || "",
          lat: null, lng: null, coords: i.coords || "", approx: true, placement: "", themes: (i.themes || []).filter(t => THEMES[t]),
          brief: i.brief || "", links: (i.links || []).filter(l => safeUrl(l.url)), image: null, origin: "mine", added: new Date().toISOString().slice(0, 10),
        });
      });
      localStorage.setItem("casebook.v2.migrated", "1");
      saveOverlay();
    } catch (e) {}
  }
  function merge() {
    const removed = new Set(overlay.removed);
    const list = base.filter(b => !removed.has(b.id)).map(b => overlay.edits[b.id] ? { ...b, ...overlay.edits[b.id] } : b);
    const maxNo = Math.max(0, ...base.map(b => b.no || 0));
    overlay.added.forEach((a, i) => list.push({ ...a, no: a.no || maxNo + i + 1 }));
    items = list;
    regionGuess(items);
  }
  function regionGuess(list) {
    const map = { "USA": "North America", "United States": "North America", "Canada": "North America", "Mexico": "Latin America", "UK": "Europe", "United Kingdom": "Europe", "Australia": "Oceania", "New Zealand": "Oceania" };
    list.forEach(it => { if (!it.region) it.region = map[it.country] || "Unknown"; });
  }

  // ---------- View state ----------
  const field = $("#field"), ptsEl = $("#pts"), panG = $("#pan"), guidesG = $("#guides"), terrG = $("#terr");
  const view = { layout: "location", zoom: 1, x: 0, y: 0 };
  const filters = { themes: new Set(), regions: new Set(), stages: new Set(), yMin: 1940, yMax: 2030, q: "" };
  let yearBounds = [1940, 2030];
  let anchors = new Map();   // world position for the current layout
  let pos = new Map();       // screen position at the current zoom (before pan)
  let selected = null;
  const els = new Map();
  const labelSize = new Map();

  function matches(it) {
    if (filters.themes.size && !(it.themes || []).some(t => filters.themes.has(t))) return false;
    if (filters.regions.size && !filters.regions.has(it.region)) return false;
    if (filters.stages.size && !filters.stages.has(it.stage)) return false;
    const y = it.axisYear || firstYear(it.year);
    if (y && (y < filters.yMin || y > filters.yMax)) return false;
    if (filters.q) {
      const hay = [it.title, it.city, it.country, it.site, it.year, it.designers, it.scale, it.brief, it.region, STAGES[it.stage], sourceOf(it),
        ...(it.themes || []).map(t => THEMES[t])].join(" ").toLowerCase();
      if (!filters.q.toLowerCase().split(/\s+/).every(w => hay.includes(w))) return false;
    }
    return true;
  }
  const activeFilterCount = () => filters.themes.size + filters.regions.size + filters.stages.size +
    ((filters.yMin > yearBounds[0] || filters.yMax < yearBounds[1]) ? 1 : 0);

  // ---------- Layouts (world coordinates) ----------
  const K = 12; // world units per degree
  const T_MIN = Math.log(2032 - 1940), T_MAX = Math.log(2032 - 2028);
  const yearX = (y) => (T_MIN - Math.log(2032 - Math.min(Math.max(y, 1940), 2028))) / (T_MIN - T_MAX) * 2600;
  const LANE = 170;

  function computeAnchors(layout) {
    const m = new Map();
    if (layout === "location") {
      let un = 0;
      items.forEach(it => {
        if (it.lat == null || it.lng == null) { m.set(it.id, { x: (-170 + 180) * K + (un % 6) * 30, y: (90 + 62) * K + Math.floor(un / 6) * 30 }); un++; }
        else m.set(it.id, { x: (it.lng + 180) * K, y: (90 - it.lat) * K });
      });
    } else if (layout === "theme") {
      THEME_ORDER.forEach((t, ti) => {
        const a = -Math.PI / 2 + ti / THEME_ORDER.length * Math.PI * 2;
        const cx = Math.cos(a) * 900, cy = Math.sin(a) * 520;
        items.filter(it => primary(it) === t).sort((p, q) => p.no - q.no).forEach((it, k) => {
          const r = 48 * Math.sqrt(k + .6), ang = k * 2.39996;
          m.set(it.id, { x: cx + Math.cos(ang) * r, y: cy + Math.sin(ang) * r });
        });
      });
    } else {
      items.forEach(it => {
        const y = it.axisYear || firstYear(it.year) || 2026;
        m.set(it.id, { x: yearX(y), y: THEME_ORDER.indexOf(primary(it)) * LANE });
      });
    }
    return m;
  }

  // Spread out points that would overlap at this zoom, keeping them near their true position.
  function relax(zoom) {
    const D = 18, list = items.map((it, i) => {
      const a = anchors.get(it.id);
      return { id: it.id, ax: a.x * zoom, ay: a.y * zoom, x: a.x * zoom + Math.cos(i * 2.4) * .01, y: a.y * zoom + Math.sin(i * 2.4) * .01 };
    });
    for (let iter = 0; iter < 90; iter++) {
      let moved = false;
      for (let i = 0; i < list.length; i++) {
        const p = list[i];
        for (let j = i + 1; j < list.length; j++) {
          const q = list[j];
          const dx = q.x - p.x, dy = q.y - p.y;
          if (Math.abs(dx) > D || Math.abs(dy) > D) continue;
          const d = Math.hypot(dx, dy) || .01;
          if (d < D) {
            const push = (D - d) / 2, ux = dx / d, uy = dy / d;
            p.x -= ux * push; p.y -= uy * push; q.x += ux * push; q.y += uy * push; moved = true;
          }
        }
        p.x += (p.ax - p.x) * .02; p.y += (p.ay - p.y) * .02;
      }
      if (!moved) break;
    }
    pos = new Map(list.map(p => [p.id, { x: p.x, y: p.y }]));
  }

  // ---------- Rendering ----------
  function buildPoints() {
    ptsEl.innerHTML = "";
    els.clear();
    items.forEach(it => {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "pt" + (isNew(it) ? " new" : "");
      b.dataset.id = it.id;
      b.style.setProperty("--c", col(primary(it)));
      const y = it.axisYear || firstYear(it.year) || "";
      b.setAttribute("aria-label", `${it.title}, ${placeOf(it)}${y ? ", " + y : ""}`);
      b.innerHTML = `<span class="sq"></span><span class="lb"><span class="t">${esc(it.title)}</span><span class="m">${esc(it.city || "")}${y ? " · " + y : ""}${isNew(it) ? " · <b>New</b>" : ""}</span></span>`;
      ptsEl.appendChild(b);
      els.set(it.id, b);
    });
    measureLabels();
  }
  function measureLabels() {
    els.forEach((b, id) => { const lb = b.querySelector(".lb"); labelSize.set(id, { w: lb.offsetWidth, h: lb.offsetHeight }); });
  }
  // Label widths change once the web fonts arrive.
  document.fonts?.ready.then(() => { measureLabels(); cullLabels(); });

  function placePoints() {
    els.forEach((b, id) => { const p = pos.get(id); if (p) b.style.transform = `translate(${p.x}px, ${p.y}px)`; });
  }
  function applyPan() {
    ptsEl.style.transform = `translate(${view.x}px, ${view.y}px)`;
    panG.style.transform = `translate(${view.x}px, ${view.y}px)`;
    drawGuides();
    cullLabels();
  }
  function applyFilters() {
    let n = 0;
    items.forEach(it => { const ok = matches(it); if (ok) n++; els.get(it.id)?.classList.toggle("dim", !ok); });
    $("#count").textContent = `${n} of ${items.length} shown`;
    const fc = activeFilterCount();
    $("#filters-n").hidden = !fc; $("#filters-n").textContent = fc;
    drawTerritories(); cullLabels();
    if ($("#index").classList.contains("open")) renderIndex();
  }

  // Hide labels that would collide, giving priority to the selected, new and lower-numbered sheets.
  function cullLabels() {
    const vw = innerWidth, vh = innerHeight, placed = [];
    const order = items.slice().sort((a, b) => (b.id === selected) - (a.id === selected) || isNew(b) - isNew(a) || a.no - b.no);
    const hit = (r) => placed.some(o => r.x < o.x + o.w && r.x + r.w > o.x && r.y < o.y + o.h && r.y + r.h > o.y);
    items.forEach(it => { const p = pos.get(it.id); if (p) placed.push({ x: p.x + view.x - 6, y: p.y + view.y - 6, w: 12, h: 12, pt: it.id }); });
    order.forEach(it => {
      const el = els.get(it.id), p = pos.get(it.id); if (!el || !p) return;
      if (el.classList.contains("dim")) { el.classList.add("nolabel"); return; }
      const s = labelSize.get(it.id) || { w: 120, h: 26 };
      const r = { x: p.x + view.x + 10, y: p.y + view.y - 10, w: s.w, h: s.h };
      const onScreen = r.x > 0 && r.x + r.w < vw && r.y > 0 && r.y + r.h < vh;
      const free = onScreen && !placed.some(o => o.pt !== it.id && r.x < o.x + o.w && r.x + r.w > o.x && r.y < o.y + o.h && r.y + r.h > o.y);
      el.classList.toggle("nolabel", !free);
      if (free) placed.push(r);
    });
  }

  // Soft territories: padded, rounded hulls around nearby points that share a main theme.
  function hull(pts) {
    const P = pts.slice().sort((a, b) => a[0] - b[0] || a[1] - b[1]);
    if (P.length < 3) return P;
    const cross = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
    const lo = [], up = [];
    for (const p of P) { while (lo.length >= 2 && cross(lo[lo.length - 2], lo[lo.length - 1], p) <= 0) lo.pop(); lo.push(p); }
    for (const p of P.slice().reverse()) { while (up.length >= 2 && cross(up[up.length - 2], up[up.length - 1], p) <= 0) up.pop(); up.push(p); }
    return lo.slice(0, -1).concat(up.slice(0, -1));
  }
  function blobPath(points, pad) {
    const ring = [];
    points.forEach(([x, y]) => { for (let k = 0; k < 10; k++) { const a = k / 10 * Math.PI * 2; ring.push([x + Math.cos(a) * pad, y + Math.sin(a) * pad]); } });
    const h = hull(ring);
    if (h.length < 3) return "";
    const mid = (a, b) => [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
    let d = `M${mid(h[h.length - 1], h[0]).join(" ")}`;
    h.forEach((p, i) => { const m = mid(p, h[(i + 1) % h.length]); d += ` Q${p[0].toFixed(1)} ${p[1].toFixed(1)} ${m[0].toFixed(1)} ${m[1].toFixed(1)}`; });
    return d + "Z";
  }
  function drawTerritories() {
    const groups = {};
    items.filter(matches).forEach(it => { (groups[primary(it)] ||= []).push(pos.get(it.id)); });
    let html = "";
    Object.entries(groups).forEach(([t, list]) => {
      const clusters = [];
      if (view.layout === "theme") clusters.push(list);
      else {
        const left = list.slice();
        while (left.length) {
          const c = [left.pop()];
          for (let i = 0; i < c.length; i++) for (let j = left.length - 1; j >= 0; j--)
            if (Math.hypot(left[j].x - c[i].x, left[j].y - c[i].y) < 80) c.push(left.splice(j, 1)[0]);
          clusters.push(c);
        }
      }
      clusters.forEach(c => {
        const d = blobPath(c.map(p => [p.x, p.y]), c.length > 1 ? 24 : 18);
        if (d) html += `<path class="terr" d="${d}" fill="${col(t)}" stroke="${col(t)}"/>`;
      });
    });
    terrG.innerHTML = html;
  }

  // Grid lines cover the whole screen in every view, and their spacing adapts to the zoom.
  const pickStep = (steps, unitPx, minPx = 56) => steps.find(st => st * unitPx >= minPx) || steps[steps.length - 1];
  function drawGuides() {
    const z = view.zoom, vw = innerWidth, vh = innerHeight, mobile = vw < 760;
    // Drawn a screen beyond each edge so lines are already there while the view glides.
    const m = Math.max(vw, vh), x0 = -view.x - m, x1 = -view.x + vw + m, y0 = -view.y - m, y1 = -view.y + vh + m;
    const left = -view.x, top = -view.y;
    let g = "";

        if (lng >= -180 && lng <= 180 && lng % (step * 2) === 0) g += `<text class="guide-label" x="${k * px + 4}" y="${top + (mobile ? 74 : 78)}">${Math.abs(lng)}°${lng < 0 ? "W" : lng > 0 ? "E" : ""}</text>`;
      }
      const oy = 90 * K * z;

      }

      for (let i = Math.floor(y0 / lane); i * lane <= y1; i++) hline(i * lane, i >= 0 && i < THEME_ORDER.length ? "strong" : "");

      const ticks = [];
      const add = (y, major) => { const x = yearX(y) * z; if (ticks.every(t => Math.abs(t.x - x) >= 50)) ticks.push({ y, x, major }); };
      for (let y = 1940; y <= 2020; y += 10) add(y, true);
      add(2025, true);
      for (let y = 1945; y <= 2025; y += 5) add(y, false);

    const it = byId(id);
    if (it && !matches(it)) {
      filters.themes.clear(); filters.regions.clear(); filters.stages.clear(); [filters.yMin, filters.yMax] = yearBounds; filters.q = ""; $("#q").value = "";
      applyFilters();
    }
  }

  let sortKey = "no", sortDir = 1;
  function renderIndex() {
    const list = items.filter(matches);
    const val = { no: i => i.no, title: i => i.title.toLowerCase(), place: i => placeOf(i).toLowerCase(), year: i => i.axisYear || firstYear(i.year) || 0, stage: i => i.stage || "" };
    list.sort((a, b) => (val[sortKey](a) > val[sortKey](b) ? 1 : val[sortKey](a) < val[sortKey](b) ? -1 : 0) * sortDir);
    $("#index-sub").textContent = `${list.length} of ${items.length} case studies${activeFilterCount() || filters.q ? " (filtered)" : ""}. Click a row to open it.`;
    const th = (k, l) => `<th data-k="${k}" ${sortKey === k ? `aria-sort="${sortDir > 0 ? "ascending" : "descending"}"` : ""}>${l}${sortKey === k ? (sortDir > 0 ? " ↑" : " ↓") : ""}</th>`;
    $("#index-body").innerHTML = `<table class="idx"><thead><tr>${th("no", "No.")}${th("title", "Case study")}${th("place", "Place")}${th("year", "Year")}${th("stage", "Stage")}</tr></thead><tbody>
      ${list.map(it => `<tr data-id="${esc(it.id)}" tabindex="0"><td class="no">${code(it.no)}</td><td><span class="dot" style="--c:${col(primary(it))}"></span>${esc(it.title)}</td><td>${esc(placeOf(it))}</td><td>${esc(it.year || "")}</td><td>${esc(STAGES[it.stage] || "")}</td></tr>`).join("")}
    </tbody></table>`;
  }
  $("#index-body").addEventListener("click", (e) => {
    const h = e.target.closest("th[data-k]");
    if (h) { sortDir = sortKey === h.dataset.k ? -sortDir : 1; sortKey = h.dataset.k; renderIndex(); return; }
    const r = e.target.closest("tr[data-id]"); if (r) focusPoint(r.dataset.id);
  });
  $("#index-body").addEventListener("keydown", (e) => { const r = e.target.closest("tr[data-id]"); if (r && e.key === "Enter") focusPoint(r.dataset.id); });

  function renderAbout() {
    const mine = overlay.added.length + Object.keys(overlay.edits).length + overlay.removed.length;
    $("#about-body").innerHTML = `
      <p><strong>Casebook</strong> is a field of case studies in urbanism and architecture. Each square is one place.</p>
      <h3>Arranging the field</h3>
      <p><strong>Place</strong> puts every square where it is in the world, using latitude and longitude, with no map drawn underneath. Squares that would overlap are nudged apart slightly. <strong>Theme</strong> gathers them by main theme. <strong>Year</strong> lays them along a timeline, with recent years given more room.</p>
      <p>Positions come from OpenStreetMap. Where a source names the exact site or address, the square sits there. Otherwise it sits at the city centre and is marked as approximate.</p>
      <h3>Colours</h3>
      <div class="legend">${THEME_ORDER.map(t => `<span class="tag" style="--c:${col(t)}"><i></i>${esc(THEMES[t])}</span>`).join("")}</div>
      <p>Soft shapes gather nearby squares that share a main theme. A square with a ring around it was added in the last ${NEW_DAYS} days.</p>
      <h3>Sources and photos</h3>
      <p>New projects come from ArchDaily, Dezeen, Planetizen, Urbanize Atlanta and Urban Omnibus. Facts come only from each article or the project's own website. Photos are shown from the publishers' pages and belong to the photographers credited under each one.</p>
      <h3>Your own changes</h3>
      <p>You can add, edit or remove case studies here. Those changes are saved in this browser only, so other devices and visitors won't see them. ${mine ? `You have <strong>${mine}</strong> saved change${mine === 1 ? "" : "s"}.` : ""}</p>
      <div class="actions">
        <button class="btn primary" type="button" data-act="add">+ Add a case study</button>
        <button class="btn" type="button" data-act="export">Export my changes</button>
        <button class="btn" type="button" data-act="import">Import</button>
        ${mine ? `<button class="btn danger" type="button" data-act="reset">Undo all my changes</button>` : ""}
      </div>`;
  }
  $("#about-body").addEventListener("click", (e) => {
    const act = e.target.closest("[data-act]")?.dataset.act;
    if (act === "add") openForm(null);
    if (act === "export") exportChanges();
    if (act === "import") $("#import-file").click();
    if (act === "reset" && confirm("Undo every change you've made in this browser? The shared case studies stay as they are.")) {
      overlay = { added: [], edits: {}, removed: [] }; saveOverlay(); rebuild(); renderAbout(); toast("Your changes were undone.");
    }
  });

  // ---------- Add / edit ----------
  const dlg = $("#dlg");
  function openForm(id) {
    const it = id ? byId(id) : null;
    const v = (k) => esc(it?.[k] ?? "");
    const links = (it?.links || []).map(l => `${l.label} | ${l.url}`).join("\n");
    dlg.innerHTML = `
      <div class="sheet-head"><div><h2>${it ? "Edit case study" : "Add a case study"}</h2><p>Saved in this browser only.</p></div><button class="btn icon" type="button" data-act="cancel" aria-label="Close">×</button></div>
      <form class="form" id="case-form">
        <label class="full"><span>Title *</span><input class="field" name="title" required value="${v("title")}"></label>
        <label><span>City</span><input class="field" name="city" value="${v("city")}"></label>
        <label><span>Country</span><input class="field" name="country" value="${v("country")}"></label>
        <label class="full"><span>Site or address</span><input class="field" name="site" value="${v("site")}" placeholder="Used to place it on the field"></label>
        <label><span>Year</span><input class="field" name="year" value="${v("year")}" placeholder="e.g. 2012 or 2019–2024"></label>
        <label><span>Stage</span><select class="field" name="stage">${Object.entries(STAGES).map(([k, l]) => `<option value="${k}" ${it?.stage === k ? "selected" : ""}>${l}</option>`).join("")}</select></label>
        <label><span>Region</span><select class="field" name="region">${REGIONS.map(r => `<option ${it?.region === r ? "selected" : ""}>${r}</option>`).join("")}</select></label>
        <label><span>Latitude, longitude</span><input class="field" name="latlng" value="${it?.lat != null ? `${it.lat}, ${it.lng}` : ""}" placeholder="Leave blank to look it up"></label>
        <label class="full"><span>Designers</span><input class="field" name="designers" value="${v("designers")}"></label>
        <label class="full"><span>Scale</span><input class="field" name="scale" value="${v("scale")}"></label>
        <label class="full"><span>Short description</span><textarea class="field" name="brief" rows="2">${v("brief")}</textarea></label>
        <fieldset class="full"><legend>Themes (the first one sets the colour)</legend>
          <div class="picks">${THEME_ORDER.map(t => `<label><input type="checkbox" name="themes" value="${t}" ${it?.themes?.includes(t) ? "checked" : ""}><span class="chip" style="--c:${col(t)}"><i></i>${esc(THEMES[t])}</span></label>`).join("")}</div>
        </fieldset>
        <label class="full"><span>Sources, one per line: title | web address</span><textarea class="field" name="links" rows="3">${esc(links)}</textarea></label>
        <label><span>Photo web address</span><input class="field" name="img" value="${esc(it?.image?.url || "")}"></label>
        <label><span>Photo credit</span><input class="field" name="credit" value="${esc(it?.image?.credit || "")}"></label>
        <div class="form-foot">
          ${it ? `<button class="btn danger" type="button" data-act="delete" style="margin-right:auto">Remove</button>` : ""}
          <button class="btn" type="button" data-act="cancel">Cancel</button>
          <button class="btn primary" type="submit">${it ? "Save" : "Add"}</button>
        </div>
      </form>`;
    const order = [...(it?.themes || [])];
    $$("input[name=themes]", dlg).forEach(cb => cb.addEventListener("change", () => {
      const i = order.indexOf(cb.value);
      if (cb.checked && i < 0) order.push(cb.value);
      if (!cb.checked && i >= 0) order.splice(i, 1);
    }));
    $("#case-form", dlg).addEventListener("submit", async (e) => {
      e.preventDefault();
      const f = new FormData(e.target), g = (k) => String(f.get(k) || "").trim();
      const data = { title: g("title"), city: g("city"), country: g("country"), site: g("site"), year: g("year"), stage: g("stage"), region: g("region"),
        designers: g("designers"), scale: g("scale"), brief: g("brief"), themes: order.filter(t => THEMES[t]) };
      data.axisYear = firstYear(data.year);
      data.links = g("links").split("\n").map(l => { const [a, b] = l.includes("|") ? l.split("|") : ["", l]; const u = safeUrl((b || "").trim()); return u ? { label: a.trim(), url: u } : null; }).filter(Boolean);
      const img = safeUrl(g("img")); data.image = img ? { url: img, credit: g("credit") } : null;
      const ll = g("latlng").match(/(-?\d+(?:\.\d+)?)\s*,\s*(-?\d+(?:\.\d+)?)/);
      if (ll) { data.lat = +ll[1]; data.lng = +ll[2]; data.approx = false; data.placement = "Position entered by hand."; }
      else if (!it || it.lat == null || g("site") !== (it.site || "") || g("city") !== (it.city || "")) {
        const q = [data.site, data.city, data.country].filter(Boolean).join(", ");
        const found = q ? await geocode(q) : null;
        if (found) { data.lat = found.lat; data.lng = found.lng; data.approx = !data.site; data.placement = (data.site ? "Placed at the site." : "Placed at the city centre, approximate.") + " Position from OpenStreetMap."; }
        else if (!it) { data.lat = null; data.lng = null; data.approx = true; data.placement = ""; toast("Couldn't find that place. It's listed under “Not yet placed”."); }
      }
      if (data.lat != null) data.coords = `${Math.abs(data.lat).toFixed(4)}° ${data.lat >= 0 ? "N" : "S"}, ${Math.abs(data.lng).toFixed(4)}° ${data.lng >= 0 ? "E" : "W"}`;
      let targetId;
      if (it && it.origin === "mine") { Object.assign(overlay.added.find(a => a.id === it.id), data); targetId = it.id; }
      else if (it) { overlay.edits[it.id] = { ...(overlay.edits[it.id] || {}), ...data }; targetId = it.id; }
      else {
        targetId = "mine-" + Math.random().toString(36).slice(2, 9);
        overlay.added.push({ id: targetId, origin: "mine", added: new Date().toISOString().slice(0, 10), ...data });
      }
      saveOverlay(); dlg.close(); rebuild();
      toast(it ? "Saved." : "Added to the field.");
      setTimeout(() => focusPoint(targetId), 200);
    });
    dlg.showModal();
  }
  dlg.addEventListener("click", (e) => {
    if (e.target === dlg) { dlg.close(); return; }
    const act = e.target.closest("[data-act]")?.dataset.act;
    if (act === "cancel") dlg.close();
    if (act === "delete" && selected) {
      const it = byId(selected);
      if (!confirm(`Remove “${it.title}” from the field in this browser?`)) return;
      if (it.origin === "mine") overlay.added = overlay.added.filter(a => a.id !== it.id);
      else overlay.removed.push(it.id);
      saveOverlay(); dlg.close(); closePanel(); rebuild(); toast("Removed.");
    }
  });
  async function geocode(q) {
    try {
      const r = await fetch("https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&q=" + encodeURIComponent(q), { headers: { "Accept-Language": "en" } });
      const j = await r.json();
      return j[0] ? { lat: +(+j[0].lat).toFixed(4), lng: +(+j[0].lon).toFixed(4) } : null;
    } catch (e) { return null; }
  }

  // ---------- Export / import ----------
  let downloads = null;
  if (window.claude?.use) window.claude.use("downloads").then(d => { downloads = d; }).catch(() => {});
  async function exportChanges() {
    const filename = `casebook-my-changes-${new Date().toISOString().slice(0, 10)}.json`, data = JSON.stringify(overlay, null, 2);
    if (downloads) {
      try { await downloads.save({ filename, data }); toast("Exported."); }
      catch (err) { toast(err?.code === "declined" ? "Export cancelled." : "Couldn't export here."); }
      return;
    }
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([data], { type: "application/json" }));
    a.download = filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    toast("Exported.");
  }
  $("#import-file").addEventListener("change", async (e) => {
    const file = e.target.files?.[0]; e.target.value = ""; if (!file) return;
    try {
      const o = JSON.parse(await file.text());
      if (!o || !Array.isArray(o.added)) throw new Error();
      if (!confirm(`Replace your changes in this browser with the ones in “${file.name}”?`)) return;
      overlay = { added: o.added.filter(a => a && a.title && a.id), edits: o.edits || {}, removed: Array.isArray(o.removed) ? o.removed : [] };
      saveOverlay(); rebuild(); renderAbout(); toast("Imported.");
    } catch (err) { toast("That file isn't a Casebook export."); }
  });

  // ---------- Controls ----------
  $$(".seg button").forEach(b => b.addEventListener("click", () => setLayout(b.dataset.layout)));
  $("#zoom-in").addEventListener("click", () => zoomAt(1.5, innerWidth / 2, innerHeight / 2));
  $("#zoom-out").addEventListener("click", () => zoomAt(1 / 1.5, innerWidth / 2, innerHeight / 2));
  $("#zoom-fit").addEventListener("click", () => fit(true));
  document.addEventListener("keydown", (e) => {
    if (dlg.open || /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName)) return;
    if (e.key === "Escape") { if (panel.classList.contains("open")) closePanel(); else closeSheets(); }
    if (e.key === "+" || e.key === "=") zoomAt(1.4, innerWidth / 2, innerHeight / 2);
    if (e.key === "-") zoomAt(1 / 1.4, innerWidth / 2, innerHeight / 2);
    if (e.key === "1") setLayout("location");
    if (e.key === "2") setLayout("theme");
    if (e.key === "3") setLayout("year");
    if (e.key === "/") { e.preventDefault(); $("#q").focus(); }
  });
  let resizeTimer;
  addEventListener("resize", () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(() => { relax(view.zoom); renderAll(); }, 150); });

  function rebuild() {
    merge();
    const ys = items.map(i => i.axisYear || firstYear(i.year)).filter(Boolean);
    const lo = Math.floor(Math.min(...ys, 1940) / 10) * 10, hi = Math.max(...ys, 2026);
    if (filters.yMin === yearBounds[0]) filters.yMin = lo;
    if (filters.yMax === yearBounds[1]) filters.yMax = hi;
    yearBounds = [lo, hi];
    buildPoints();
    anchors = computeAnchors(view.layout);
    relax(view.zoom);
    renderAll();
    applyFilters();
    const fresh = items.filter(isNew).length;
    $("#latest-badge").hidden = !fresh; $("#latest-badge").textContent = fresh;
    $("#brand-sub").textContent = `A field of ${items.length} urban case studies`;
    if (selected && !byId(selected)) closePanel();
  }

  // ---------- Start ----------
  async function start() {
    try {
      const r = await fetch("data/casebook.json", { cache: "no-cache" });
      base = (await r.json()).items || [];
    } catch (e) {
      $("#loading").textContent = "Couldn't load the case studies. Open this page from the website, or from a local web server.";
      return;
    }
    try { const s = await fetch("data/skipped.json", { cache: "no-cache" }); if (s.ok) skipped = await s.json(); } catch (e) {}
    loadOverlay(); migrateV1();
    rebuild();
    anchors = computeAnchors(view.layout);
    fit(false);
    $("#loading").remove();
    const id = decodeURIComponent(location.hash.replace(/^#\//, ""));
    if (id && byId(id)) setTimeout(() => focusPoint(id), 300);
  }
  start();
})();
</script>
</body>
</html>
